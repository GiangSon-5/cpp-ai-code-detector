apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-ai-service
  namespace: ai-detector
  labels:
    app: fastapi-ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-ai-service
  template:
    metadata:
      labels:
        app: fastapi-ai-service
    spec:
      containers:
      - name: fastapi
        image: ai-detector/fastapi-service:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: "12Gi"
          requests:
            memory: "4Gi"
            cpu: "2"
        ports:
        - containerPort: 8001
        envFrom:
        - secretRef:
            name: app-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 60
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-ai-service
  namespace: ai-detector
spec:
  selector:
    app: fastapi-ai-service
  ports:
  - port: 8001
    targetPort: 8001
