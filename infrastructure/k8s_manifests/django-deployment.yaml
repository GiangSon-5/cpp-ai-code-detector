apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-web
  namespace: ai-detector
  labels:
    app: django-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-web
  template:
    metadata:
      labels:
        app: django-web
    spec:
      containers:
      - name: django
        image: ai-detector/django-web:latest
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: "2Gi"
          requests:
            memory: "512Mi"
            cpu: "500m"
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: app-secrets
        env:
        - name: FASTAPI_AI_URL
          value: "http://fastapi-ai-service:8001"
---
apiVersion: v1
kind: Service
metadata:
  name: django-web
  namespace: ai-detector
spec:
  selector:
    app: django-web
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
