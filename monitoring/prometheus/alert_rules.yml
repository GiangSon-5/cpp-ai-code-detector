groups:
  - name: ai-detector-alerts
    rules:
      - alert: HighInferenceLatency
        expr: histogram_quantile(0.95, rate(ai_inference_duration_seconds_bucket[5m])) > 30
        for: 5m
        annotations:
          summary: "P95 inference latency > 30s"
          description: "GPU Worker is taking too long to respond."
          
      - alert: GPUMemoryHigh
        expr: gpu_memory_usage_bytes > 14000000000
        for: 2m
        annotations:
          summary: "GPU VRAM usage > 14GB (OOM risk)"
          description: "Model Manager might need cleanup."
          
      - alert: ModelDrift
        expr: avg_over_time(ai_score_distribution[24h]) < 0.3 or avg_over_time(ai_score_distribution[24h]) > 0.8
        for: 1h
        annotations:
          summary: "Possible model drift detected"
          description: "AI score distribution has shifted significantly."
