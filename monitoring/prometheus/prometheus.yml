# prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  - job_name: 'fastapi'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['fastapi-ai-service:8001']
      
  - job_name: 'django'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['django-web:8000']
